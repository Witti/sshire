[package]
name = "sshire"
version = "0.1.1"
edition = "2024"
description = "TUI SSH launcher with host management, icons, tags, connection log and secure password storage"
license = "MIT OR Apache-2.0"
authors = ["Daniel Wittberger"]
readme = "README.md"
repository = "https://github.com/witti/sshire"
homepage = "https://github.com/witti/sshire"
keywords = ["ssh", "tui", "launcher", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
getrandom = "0.4.3"
glob = "0.3.4"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
signal-hook = "0.4.4"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
libc = "0.2.189"

# Argon2 is deliberately expensive (64 MiB, 3 passes). In an unoptimized debug
# build a single unlock takes many seconds, which would make tests and the TUI
# painfully slow during development. So only these dependencies are optimized
# in the dev profile as well.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Release build for distribution: smaller and a bit faster.
# `lto` optimizes across crate boundaries, `codegen-units = 1` lets the compiler
# optimize more (at the cost of a longer build), `strip` removes debug symbols
# from the binary.
[profile.release]
lto = true
codegen-units = 1
strip = true

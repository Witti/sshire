# On every version tag (e.g. `v0.2.0`) builds the release archives and creates
# a GitHub release from them:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Flow: quality gate (fmt, clippy, tests) on macOS + Linux → builds for
# macOS (universal), Linux x86_64 and Linux aarch64 (static, musl) →
# release with archives and SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The tag must match the version in Cargo.toml (v0.2.0 ↔ version = "0.2.0").
      - name: Check tag against Cargo.toml
        if: matrix.os == 'ubuntu-latest'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build macOS (universal)
        if: matrix.name == 'macos-universal'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output sshire \
            target/aarch64-apple-darwin/release/sshire \
            target/x86_64-apple-darwin/release/sshire
          # Ad-hoc signature: Apple Silicon only runs signed binaries.
          codesign --force --sign - sshire

      # musl → statically linked binary without runtime dependencies.
      # `musl-gcc` is needed because SQLite (rusqlite/bundled) ships C code.
      - name: Build Linux (musl)
        if: matrix.target
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/sshire sshire

      - name: Smoke test
        run: ./sshire --version

      - name: Package archive
        run: |
          name="sshire-${GITHUB_REF_NAME#v}-${{ matrix.name }}"
          mkdir "$name"
          cp sshire README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: sshire-*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS

      # Tags with a hyphen (e.g. v0.2.0-rc.1) are published as pre-releases.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sshire $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

  # Updates the formula in the Homebrew tap (`<owner>/homebrew-tap`), so users
  # get the new version with `brew upgrade sshire`. Runs only for stable tags
  # and only if the repository secret HOMEBREW_TAP_TOKEN is set (a fine-grained
  # token with "Contents: read and write" on the tap repository).
  homebrew:
    name: Update Homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
    steps:
      - name: Check for tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set – skipping Homebrew tap update"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - name: Download checksums from the release
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS

      - name: Commit formula to the tap
        if: steps.token.outputs.present == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          # An empty tap repository has no branch yet; always work on main.
          git -C tap checkout -B main
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$version" SHA256SUMS "$GITHUB_REPOSITORY" > tap/Formula/sshire.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sshire.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "sshire $version"
            git push origin main
          fi
